[package]
name = "agent-run"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Run one-turn tasks with detected AI-agent CLIs (Claude Code, Codex, OpenCode): transports, stream parsers, and turn execution"
repository = "https://github.com/kacperpaczos/agent-kit"

[dependencies]
agent-detect = { path = "../agent-detect" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
agent-detect = { path = "../agent-detect", features = ["test-support"] }
tempfile = "3"
