# Engine-agent definitions, in default-engine preference order (spec §6.1).

[[agent]]
id = "claude"
name = "Claude Code"
bin = "claude"
fallback_bins = ["openclaude"]
bin_env = "CLAUDE_BIN"
config_dirs = ["$CLAUDE_CONFIG_DIR || ~/.claude"]
version_args = ["--version"]
auth_probe = ["auth", "status"]
transport = "claude-stream-json"
fallback_models = ["default", "sonnet", "opus", "haiku"]

[agent.sessions]
path = "~/.claude.json"
parser = "claude-json"

# Interactive launch (flags checked against `claude --help`).
[agent.terminal]
context = { kind = "system_prompt_flag", flag = "--append-system-prompt" }

[agent.terminal.modes]
auto = ["--permission-mode", "acceptEdits"]
ask = ["--permission-mode", "manual"]
plan = ["--permission-mode", "plan"]

[[agent]]
id = "opencode"
name = "OpenCode"
bin = "opencode"
fallback_bins = ["opencode-cli"]
bin_env = "OPENCODE_BIN"
config_dirs = ["$XDG_CONFIG_HOME/opencode || ~/.config/opencode"]
version_args = ["--version"]
transport = "opencode-run-json"
fallback_models = ["default"]

[agent.models]
args = ["models", "--verbose"]
parser = "opencode-models"

[agent.sessions]
path = "$XDG_DATA_HOME/opencode/opencode.db || ~/.local/share/opencode/opencode.db"
parser = "opencode-sqlite"

# Interactive TUI launch (flags checked against `opencode --help`); the TUI
# has no plan/read-only flag, so `plan` is unsupported.
[agent.terminal]
context = { kind = "prompt_flag", flag = "--prompt" }

[agent.terminal.modes]
auto = ["--auto"]
ask = []

[[agent]]
id = "codex"
name = "Codex"
bin = "codex"
fallback_bins = []
bin_env = "CODEX_BIN"
config_dirs = ["$CODEX_HOME || ~/.codex"]
version_args = ["--version"]
transport = "codex-exec-json"
fallback_models = ["default"]

[agent.sessions]
path = "$CODEX_HOME/sessions || ~/.codex/sessions"
parser = "codex-jsonl"

# Interactive TUI launch (flags checked against `codex --help`). The context
# becomes developer instructions via a `-c` config override, not the first
# user message.
[agent.terminal]
# The interactive update banner is noise inside an embedding host.
args = ["-c", "check_for_update_on_startup=false"]
cwd_flag = "-C"
context = { kind = "config_flag", flag = "-c", key = "developer_instructions" }

[agent.terminal.modes]
auto = ["-a", "never", "-s", "workspace-write"]
ask = ["-a", "on-request", "-s", "workspace-write"]
plan = ["-a", "on-request", "-s", "read-only"]
