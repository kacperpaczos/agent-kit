[package]
name = "agent-sessions"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Read-only transcript readers for AI-agent CLIs (Claude Code, Codex, OpenCode): session listing, normalized events, skill activations, secret redaction"
repository = "https://github.com/kacperpaczos/agent-kit"

[features]
default = ["opencode"]
# OpenCode keeps sessions in SQLite; the feature pulls in a bundled SQLite.
opencode = ["dep:rusqlite"]

[dependencies]
serde_json = "1"
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"], optional = true }

[dev-dependencies]
agent-detect = { path = "../agent-detect" }
tempfile = "3"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
